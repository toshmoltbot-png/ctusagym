# CloudCannon configuration for CT USAG Gym site
# Docs: https://cloudcannon.com/documentation/

source: src
paths:
  data: _data
  includes: _includes
  output: _site

collections_config:
  # === HOMEPAGE (top to bottom) ===
  photos:
    path: _data/photos
    name: Homepage Top - Carousel Photos
    icon: photo_library
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      image:
        - key: src
      gallery:
        image:
          - key: src
        fit: cover

  announcements:
    path: _data/announcements
    name: Homepage Sidebar + News Page - Announcements
    icon: campaign
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      subtext:
        - key: date
      icon: campaign

  # === HOMEPAGE FEATURE ===
  homepage_feature:
    path: _data
    name: Homepage Bottom - Featured Section
    icon: star
    output: false
    glob:
      - _data/homepage_feature.json
    preview:
      text:
        - key: title
      subtext:
        - key: label
      image:
        - key: image
      gallery:
        image:
          - key: image
        fit: cover

  # === SEASON (Calendar > Events > State Meets) ===
  calendar:
    path: _data/calendar
    name: Calendar - Entries
    icon: calendar_month
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: host
      icon: calendar_month

  state_meets:
    path: _data/state_meets
    name: State Meets - Meet Details
    icon: emoji_events
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      icon: emoji_events

  fees:
    path: _data/fees
    name: State Meets - Entry Fees
    icon: payments
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: level
      subtext:
        - key: state
      icon: payments

  qualification_scores:
    path: _data/qualification_scores
    name: State Meets - Qualification Scores
    icon: score
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: program
      subtext:
        - key: score
      icon: score

  # === COMPETITION POLICIES ===
  policies:
    path: _data/policies
    name: Competition Policies - Sections
    icon: gavel
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      subtext:
        - key: jump_label
      icon: gavel
    _inputs:
      title:
        type: text
        label: Section Heading
        comment: Shown as the bold heading at the top of the section box
      jump_label:
        type: text
        label: Quick Jump Button Text
        comment: Leave blank to hide this section from the row of jump buttons at the top of the page
      anchor:
        type: text
        label: Anchor (advanced)
        comment: Used by the jump buttons. Only change this if you know what it does.
      content:
        type: html
        label: Main Text
        options:
          bold: true
          italic: true
          link: true
          bulletedlist: true
          numberedlist: true
          format: p h3
      callout:
        type: html
        label: Highlighted Grey Box (optional)
        comment: Leave blank if this section does not need a highlighted box
        options:
          bold: true
          italic: true
          link: true
          bulletedlist: true
          numberedlist: true
          format: p h3
      content_after:
        type: html
        label: Extra Notes Below (optional)
        comment: Appears under a divider line at the bottom of the section
        options:
          bold: true
          italic: true
          link: true
          bulletedlist: true
          numberedlist: true
          format: p h3
      block:
        type: select
        label: Automatic Table (advanced)
        comment: Pulls in a table that is edited elsewhere. Leave as None for normal text sections.
        options:
          values:
            - value: ''
              label: None
            - value: fees_table
              label: Entry Fees table
            - value: qualification_table
              label: Qualification Scores table
            - value: documents_grid
              label: Documents & links grid
      cards_title:
        type: text
        label: Info Cards - Heading (optional)
      cards_intro:
        type: textarea
        label: Info Cards - Intro Text (optional)
      cards:
        type: array
        label: Info Cards (optional)
      cards_footnote:
        type: text
        label: Info Cards - Small Print (optional)
      links:
        type: array
        label: Documents & Links (optional)

  policies_page:
    path: _data
    name: Competition Policies - Page Intro
    icon: article
    output: false
    glob:
      - _data/policies_page.json
    _inputs:
      eyebrow:
        type: text
        label: Small Red Text Above Title
      heading:
        type: text
        label: Page Title
      intro:
        type: textarea
        label: Intro Paragraph

  # === CLUBS & PEOPLE ===
  clubs:
    path: _data/clubs
    name: Clubs - Club Directory
    icon: location_on
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: city
      icon: location_on
    _inputs:
      name:
        type: text
        label: Gym Name
      address:
        type: text
        label: Street Address
      city:
        type: text
        label: City
      state:
        type: text
        label: State
      zip:
        type: text
        label: ZIP Code
      phone:
        type: text
        label: Phone
      website:
        type: text
        label: Website
        comment: 'Just the domain, no https:// — for example: aerialsportsconditioning.com'
      email:
        type: email
        label: Email
      contact:
        type: text
        label: Contact Person
      note:
        type: text
        label: Note (optional)
        comment: Shown in small grey text next to the gym name

  judges_committee:
    path: _data/judges_committee
    name: Judges - Committee Roster
    icon: gavel
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: role
      icon: gavel

  hall_of_fame:
    path: _data/hall_of_fame
    name: Hall of Fame - Inductee Classes
    icon: military_tech
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      icon: military_tech

  wall_of_remembrance:
    path: _data/wall_of_remembrance
    name: Hall of Fame - Memorial Wall
    icon: volunteer_activism
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: years
      icon: volunteer_activism

  clinics:
    path: _data/clinics
    name: Events Hub - Camps & Clinics
    icon: school
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: location
      icon: school

  # === SITE-WIDE ===
  site_settings:
    path: _data
    name: Site-Wide Settings & Editable Documents
    icon: settings
    output: false
    glob:
      - _data/site.json

  pages:
    path: pages
    name: Pages
    icon: description
    output: true
    filter:
      base: all
    hidden: true

  navigation:
    path: _data
    name: Navigation
    icon: menu
    output: false
    glob:
      - _data/navigation.json
    hidden: true

_inputs:
  editor_label:
    hidden: true
  name:
    type: text
    label: Event Name
  status:
    type: select
    label: Status
    options:
      values:
        - sanctioned
        - pending
        - cancelled
  start:
    type: date
    label: Start Date
  end:
    type: date
    label: End Date
  host:
    type: text
    label: Host Club/Venue
  state:
    type: text
    label: State
  location:
    type: text
    label: Full Address
  address:
    type: text
    label: Street Address
  city:
    type: text
    label: City
  zip:
    type: text
    label: ZIP Code
  phone:
    type: text
    label: Phone
  website:
    type: url
    label: Website
  email:
    type: email
    label: Email
  contact:
    type: text
    label: Contact Person
  note:
    type: text
    label: Note
  date:
    type: text
    label: Date Label
  category:
    type: select
    label: Category
    options:
      values:
        - forms
        - general
        - results
        - safesport
  title:
    type: text
    label: Title
  description:
    type: textarea
    label: Description
  link:
    type: url
    label: Link URL
  src:
    type: image
    label: Photo
  alt:
    type: text
    label: Alt Text
  caption:
    type: text
    label: Caption
  label:
    type: text
    label: Small Text Above Title
  image:
    type: image
    label: Feature Photo
  image_alt:
    type: text
    label: Photo Description (Alt Text)
  link_1_text:
    type: text
    label: First Button Text
  link_1_url:
    type: url
    label: First Button Link
  link_2_text:
    type: text
    label: Second Button Text
  link_2_url:
    type: url
    label: Second Button Link
  host_meet_form_url:
    type: url
    label: Host a Meet Request Form (URL)
    comment: Paste the Google Form link here
  state_bid_form:
    type: document
    label: State Championship Bid Form (PDF)
    comment: Upload the current year's bid form
  competition_policies_url:
    type: url
    label: Competition Policies Link
    comment: Usually /policies/ — only change if the page moves
  meet_director_guidelines:
    type: document
    label: Meet Director Guidelines (PDF)
    comment: Upload the current guidelines document
  meet_director_checklist:
    type: document
    label: Meet Director Checklist (PDF)
    comment: Upload the current checklist document
  xcel_clarification:
    type: document
    label: Xcel Clarification (PDF)
    comment: Upload the current Xcel clarification document
  chairman_name:
    type: text
    label: State Chairman Name
  chairman_email:
    type: email
    label: State Chairman Email
  copyright_year:
    type: text
    label: Copyright Year
  fees_season_label:
    type: text
    label: Entry Fees Season
    comment: 'Season shown in the Entry Fees heading on the Policies page, e.g. 2026-2027'
  footer_tagline:
    type: textarea
    label: Footer Tagline

_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    heading: true

_structures:
  cards:
    values:
      - label: Info Card
        icon: badge
        value:
          card_label: ''
          card_text: ''
        _inputs:
          card_label:
            type: text
            label: Card Heading
          card_text:
            type: text
            label: Card Text
  links:
    values:
      - label: Document or Link
        icon: link
        value:
          link_text: ''
          link_url: ''
          external: false
        _inputs:
          link_text:
            type: text
            label: Link Text
          link_url:
            type: text
            label: Link URL or File Path
          external:
            type: checkbox
            label: Opens on another website
            comment: Check this for links to usagym.org, Google Forms, etc.
