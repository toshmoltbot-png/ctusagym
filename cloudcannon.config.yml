# CloudCannon configuration for CT USAG Gym site
# Docs: https://cloudcannon.com/documentation/

source: src
paths:
  data: _data
  includes: _includes
  output: _site

collections_config:
  # === HOMEPAGE (top to bottom) ===
  photos:
    path: _data/photos
    name: Homepage Top - Carousel Photos
    icon: photo_library
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      image:
        - key: src
      gallery:
        image:
          - key: src
        fit: cover

  announcements:
    path: _data/announcements
    name: Homepage Sidebar + News Page - Announcements
    icon: campaign
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      subtext:
        - key: date
      icon: campaign

  # === SEASON (Calendar > Events > State Meets) ===
  calendar:
    path: _data/calendar
    name: Calendar Page - Season Meets
    icon: calendar_month
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: host
      icon: calendar_month

  state_meets:
    path: _data/state_meets
    name: State Meets Page - Meet Details
    icon: emoji_events
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      icon: emoji_events

  fees:
    path: _data/fees
    name: State Meets Page - Entry Fees
    icon: payments
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: level
      subtext:
        - key: state
      icon: payments

  qualification_scores:
    path: _data/qualification_scores
    name: State Meets Page - Qualification Scores
    icon: score
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: program
      subtext:
        - key: score
      icon: score

  # === CLUBS & PEOPLE ===
  clubs:
    path: _data/clubs
    name: Clubs Page - Club Directory
    icon: location_on
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: city
      icon: location_on

  judges_committee:
    path: _data/judges_committee
    name: Judges Page - Committee Roster
    icon: gavel
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: role
      icon: gavel

  hall_of_fame:
    path: _data/hall_of_fame
    name: Hall of Fame Page - Inductee Classes
    icon: military_tech
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: title
      icon: military_tech

  wall_of_remembrance:
    path: _data/wall_of_remembrance
    name: Hall of Fame Page - Memorial Wall
    icon: volunteer_activism
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: years
      icon: volunteer_activism

  clinics:
    path: _data/clinics
    name: Events Page - Camps & Clinics
    icon: school
    output: false
    text_key: editor_label
    sort:
      key: editor_label
      order: ascending
    preview:
      text:
        - key: name
      subtext:
        - key: location
      icon: school

  # === SITE-WIDE ===
  site_settings:
    path: _data
    name: Site-Wide Settings
    icon: settings
    output: false
    glob:
      - _data/site.json

  pages:
    path: pages
    name: Pages
    icon: description
    output: true
    filter:
      base: all

  navigation:
    path: _data
    name: Navigation
    icon: menu
    output: false
    glob:
      - _data/navigation.json

_inputs:
  editor_label:
    hidden: true
  name:
    type: text
    label: Event Name
  status:
    type: select
    label: Status
    options:
      values:
        - sanctioned
        - pending
        - cancelled
  start:
    type: date
    label: Start Date
  end:
    type: date
    label: End Date
  host:
    type: text
    label: Host Club/Venue
  state:
    type: text
    label: State
  location:
    type: text
    label: Full Address
  address:
    type: text
    label: Street Address
  city:
    type: text
    label: City
  zip:
    type: text
    label: ZIP Code
  phone:
    type: text
    label: Phone
  website:
    type: url
    label: Website
  email:
    type: email
    label: Email
  contact:
    type: text
    label: Contact Person
  note:
    type: text
    label: Note
  date:
    type: text
    label: Date Label
  category:
    type: select
    label: Category
    options:
      values:
        - forms
        - general
        - results
        - safesport
  title:
    type: text
    label: Title
  description:
    type: textarea
    label: Description
  link:
    type: url
    label: Link URL
  src:
    type: image
    label: Photo
  alt:
    type: text
    label: Alt Text
  caption:
    type: text
    label: Caption
  chairman_name:
    type: text
    label: State Chairman Name
  chairman_email:
    type: email
    label: State Chairman Email
  copyright_year:
    type: text
    label: Copyright Year
  footer_tagline:
    type: textarea
    label: Footer Tagline

_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    heading: true

_structures: {}
